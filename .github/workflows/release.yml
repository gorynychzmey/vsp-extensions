name: Release

# A tag vX.Y.Z.S builds vspx for every platform and publishes the binaries
# with their checksums as a GitHub release.
#
# X.Y.Z is the vsp release the core is based on (the newest upstream tag
# reachable from the core commit that go.mod replaces vsp with); S counts the
# vspx builds on that base and starts again at 1 with every new base. The
# release refuses a tag whose X.Y.Z does not match the core.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.core.outputs.describe }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z.S"
            exit 1
          fi
      # The fork carries the core commit, upstream carries the version tags.
      - name: Core base
        id: core
        env:
          TAG: ${{ github.ref_name }}
        run: |
          repl=$(go list -m -f '{{if .Replace}}{{.Replace.Path}}@{{.Replace.Version}}{{end}}' github.com/oisee/vibing-steampunk)
          if [ -z "$repl" ] || [ "${repl#*@}" = "" ]; then
            echo "::error::go.mod does not replace vsp with a module version"
            exit 1
          fi
          origin=$(go mod download -json "$repl")
          url=$(jq -r .Origin.URL <<<"$origin")
          sha=$(jq -r .Origin.Hash <<<"$origin")
          git init -q core
          git -C core fetch -q --filter=blob:none "$url" "$sha"
          git -C core fetch -q --filter=blob:none --no-tags https://github.com/oisee/vibing-steampunk "+refs/tags/v*:refs/tags/v*"
          describe=$(git -C core describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' "$sha")
          base=${describe%%-*}
          if [ "${TAG%.*}" != "$base" ]; then
            echo "::error::tag $TAG does not fit the core: it is based on $base ($describe), so the tag must be $base.<n>"
            exit 1
          fi
          echo "describe=$describe" >> "$GITHUB_OUTPUT"
          echo "vsp core: $url@$sha = $describe" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - windows/amd64
          - windows/arm64
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Deliberately not stripped (-s -w): stripped Go binaries are what
      # Microsoft Defender's machine-learning heuristic took for
      # Trojan:Win32/Wacatac.B!ml in vsp (oisee/vibing-steampunk#204).
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
          CORE: ${{ needs.check.outputs.core }}
        run: |
          GOOS=${TARGET%/*}
          GOARCH=${TARGET#*/}
          ext=""
          [ "$GOOS" = windows ] && ext=.exe
          mkdir -p dist
          GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X main.Version=$VERSION -X 'main.Commit=${GITHUB_SHA::7}, core $CORE' -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/gorynychzmey/vsp-extensions/internal/version.Version=$VERSION" \
            -o "dist/vspx-$VERSION-$GOOS-$GOARCH$ext" ./cmd/vspx
      - uses: actions/upload-artifact@v4
        with:
          name: vspx-${{ strategy.job-index }}
          path: dist/*

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum vspx-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: "vsp core: ${{ needs.check.outputs.core }}"
